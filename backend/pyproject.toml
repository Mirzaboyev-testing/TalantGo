[project]
name = "careerflow"
version = "0.1.0"
description = "CareerFlow: verified student career paths and portfolios (Telegram WebApp backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "cryptography>=42",
  "httpx>=0.27",
  "jinja2>=3.1",
  "tzdata>=2024.1",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
